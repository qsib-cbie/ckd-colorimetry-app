[project]
name = "ckd-colorimetry"
version = "2.2.0"
description = "Local CKD colorimetric research analysis for Mac"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "python-multipart", "rawpy==0.27.0", "numpy==2.4.6", "scikit-image==0.26.0", "pillow==12.3.0", "send2trash"]

[project.optional-dependencies]
test = ["pytest", "httpx"]
build = ["pyinstaller"]


[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["api/tests"]
markers = ["raw: full-resolution RAW reference comparisons"]
